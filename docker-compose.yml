name: breinerdiaz-db

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: breinerdiaz_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    # ============================================================================
    # SEGURIDAD CRÍTICA DE PUERTOS:
    # ----------------------------------------------------------------------------
    # 1. Al usar "127.0.0.1:PUERTO:5432", Docker vincula ÚNICAMENTE al loopback
    #    local. Nunca se expone a 0.0.0.0 ni a interfaces públicas/externas.
    # 2. Esto anula la vulnerabilidad de que Docker ignore las reglas de UFW.
    # 3. Permite que DBeaver o TablePlus se conecten en local o vía túnel SSH en VPS.
    # 4. Si se desea aislamiento 100% estricto sin DBeaver, comentar este bloque ports.
    # ============================================================================
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5434}:5432"

    volumes:
      # Persistencia de datos
      - postgres_data:/var/lib/postgresql/data
      # Scripts DDL/SQL de inicialización (solo se ejecutan al crear la base por primera vez)
      - ./init:/docker-entrypoint-initdb.d:ro
      # Carpeta para guardar y restaurar respaldos (pg_dump / pg_restore)
      - ./backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - breiner_internal_net

networks:
  breiner_internal_net:
    name: breiner_internal_net
    driver: bridge

volumes:
  postgres_data:
    name: breinerdiaz_postgres_data
